name: Publish to NPM

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets
          - os: ubuntu-26.04-arm
            target:
              - x86_64-unknown-linux-gnu
              - aarch64-unknown-linux-gnu
            use-cross: "zig"
 
          # Windows targets
          - os: windows-latest-arm
            targets:
              - x86_64-pc-windows-msvc
              - aarch64-pc-windows-msvc
            use-cross: "msvc"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # For cross-compilation on Linux
      - name: Install Zig (Linux cross-compile)
        id: zig
        if: ${{ matrix.use-cross == 'zig' }}
        uses: mlugg/setup-zig@v2

      - name: Install dependencies
        working-directory: packages/solid-jsx-oxc
        run: bun install

      - name: Create zig cc wrapper
        if: ${{ matrix.use-cross == 'zig' }}
        run: |
          cat << 'EOF' > zig-cc
          #!/usr/bin/env bash
          exec zig cc "$@"
          EOF
          chmod +x zig-cc

      - name: Build (MSVC cross-compile)
        if: ${{ matrix.use-cross == 'msvc' && runner.os == 'Windows' }}
        run: |
          $processes = foreach ($target in "${{ matrix.targets }}".Split(" ")) {
              Start-Process `
                -FilePath "bunx" `
                -ArgumentList @(
                    "napi", "build",
                    "--platform",
                    "--release",
                    "--target", $target,
                    "--features", "napi",
                    "--no-js",
                    "--dts", "binding.d.ts"
                ) `
                -NoNewWindow `
                -PassThru
          }
          
          $processes | ForEach-Object {
              $_.WaitForExit()
          
              if ($_.ExitCode -ne 0) {
                  throw "Build failed with exit code $($_.ExitCode)"
              }
          }
        working-directory: packages/solid-jsx-oxc
        env:
          NAPI_RS_TARGETING_NODEJS: true
          PKG_CONFIG_ALLOW_CROSS: "1"

      - name: Build (Zig cross-compile)
        if: ${{ matrix.use-cross == 'zig' }}
        run: |
              for target in ${{ matrix.targets }}; do
                bunx napi build \
                  --platform \
                  --release \
                  --target "$target" \
                  --features napi \
                  --no-js \
                  --dts binding.d.ts &
              done
              wait
        working-directory: packages/solid-jsx-oxc
        env:
          NAPI_RS_TARGETING_NODEJS: true

          CC: "zig cc"
          CXX: "zig c++"
          AR: "zig ar"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: "${{ github.workspace }}/zig-cc"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: "${{ github.workspace }}/zig-cc"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-target -C link-arg=aarch64-linux-gnu"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-target -C link-arg=x86_64-linux-gnu"

          PKG_CONFIG_ALLOW_CROSS: "1"

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: bunx napi build --platform --release --features napi --no-js --dts binding.d.ts
        working-directory: packages/solid-jsx-oxc
        env:
          NAPI_RS_TARGETING_NODEJS: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.target }}
          path: packages/solid-jsx-oxc/*.node
          archive: false
          if-no-files-found: error

  publish:
    name: Publish to NPM
    needs: build-native
    environment: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages/solid-jsx-oxc/
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          find packages/solid-jsx-oxc -type f -name "*.node" -exec mv {} packages/solid-jsx-oxc/ \;
          find packages/solid-jsx-oxc -type d -empty -delete

      - name: Publish (NPM)
        run: bunx npm publish --registry=https://registry.npmjs.org/ --loglevel info
        working-directory: packages/solid-jsx-oxc
        env:
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
